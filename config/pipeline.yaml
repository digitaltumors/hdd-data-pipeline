name: "Harmonized Drug Dataset Version 3"
description: "Harmonized collection of drug measurements across assay types (HDD_v3)."

paths:
  raw_dir: "data/rawdata"
  proc_dir: "data/procdata"
  results_dir: "data/results"

dataset:
  id: "HDD_v3"
  version: "3.0.0"
  expected_indication_count: 55506
  deprecated_experiments:
    - "ClinTox"
    - "ToxCast"

# Curated dataset objects used to populate membership flags and source IDs
sub_dataset:
  jump:
    # JUMP Cell Painting cpg0016 MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19949901/files/cpg0016_emb_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2_eod/cpg0016_emb_MultiAssayExperiment.rds"
    object_type: "mae"
    flag_column: "In.JUMP.CP"
    source_key_column: "JUMP.CP.ID"
    source_smiles_columns:
      - "JUMP.CP.SMILES"
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "AnnotationDB.Name"
      - "Control.Name"

  oasis:
    # OASIS cpg0037 MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19931212/files/cpg0037_emb_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2_eod/cpg0037_emb_MultiAssayExperiment.rds"
    object_type: "mae"
    flag_column: "In.OASIS"
    source_key_column: "OASIS.ID"
    source_smiles_columns:
      - "OASIS.SMILES"
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "OASIS.Compound.Name"
      - "AnnotationDB.Name"

  geom:
    # GEOM descriptor MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19931210/files/geom_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2_eod/geom_MultiAssayExperiment.rds"
    object_type: "mae"
    flag_column: "In.GEOM"
    source_key_column: "GEOM.Source.SMILES"
    source_smiles_columns:
      - "GEOM.Canonical.SMILES"
      - "GEOM.RDKit.SMILES"
      - "GEOM.Source.SMILES"
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "AnnotationDB.Name"

  lincs:
    # LINCS signature MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19931152/files/lincs_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2_eod/lincs_MultiAssayExperiment.rds"
    object_type: "mae"
    flag_column: "In.LINCS"
    source_key_column: "LINCS.CMap.Name"
    source_smiles_columns:
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "LINCS.CMap.Name"
      - "AnnotationDB.Name"

  ctrp:
    # CTRPv2 PharmacoSet RDS
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2_eod/CTRPv2_PSet.rds"
    object_type: "pset"
    flag_column: "In.CTRP"
    source_key_column: "CTRP.Master.CPD.ID"
    source_key_source_columns:
      - "master_cpd_id"
      - "unique.treatmentid"
    source_smiles_columns:
      - "SMILES"
      - "AnnotationDB.Canonical.SMILES"
      - "AnnotationDB.Connectivity.SMILES"
      - "AnnotationGx.Connectivity.SMILES"
    source_name_columns:
      - "AnnotationDB.Title"
      - "AnnotationDB.Mapped.Name"
      - "AnnotationGx.Title"
      - "Compound.Name"

  nci60:
    # NCI60-2026 PharmacoSet RDS
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2_eod/NCI60-2026_PSet.rds"
    object_type: "pset"
    flag_column: "In.NCI60"
    source_key_column: "NCI60.NSC"
    source_key_source_columns:
      - "NSC"
      - "unique.treatmentid"
    source_smiles_columns:
      - "SMILES"
      - "AnnotationDB.Canonical.SMILES"
      - "AnnotationDB.Connectivity.SMILES"
      - "AnnotationGx.Connectivity.SMILES"
      - "AnnotationGx.Canonical.SMILES"
    source_name_columns:
      - "AnnotationDB.Title"
      - "AnnotationDB.Mapped.Name"
      - "AnnotationGx.Title"
      - "Compound.Name"

deep_chem:
  subdir: "DEEP_CHEM"
  urls:
    blood_brain_barrier: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/BBBP.csv"
    tox21: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/tox21.csv.gz"
    sider: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/sider.csv.gz"
  expected_assays:
    tox21:
      source_compounds: 7831
      features: 12
      compounds: 5867
      dropped_ambiguous: 58
      dropped_unmatched: 1905
      dropped_many_to_one: 1
      collision_groups: 1
    sider:
      source_compounds: 1427
      features: 27
      compounds: 1397
      dropped_ambiguous: 6
      dropped_unmatched: 24
      dropped_many_to_one: 0
      collision_groups: 0

annotationdb:
  base_url: "https://annotationdb.bhklab.ca"
  compound_all_path: "/compound/all"
  compound_many_path: "/compound/many"
  fetch:
    batch_size: 50
    workers: 6
    query_delay_seconds: 0.1
    golden_bioassay: true
    indication: true
    # Optional authorization for ATC data. The pipeline remains regenerative
    # without this ignored local secret file.
    api_key_file: ".env"
    api_key_name: "ANNOTATIONDB_API_KEY"

colData:
  # Morgan fingerprint radii and vector sizes generated for every parseable SMILES
  fingerprints:
    radius_list: [2,3]
    dim_list: [1024,2048]
