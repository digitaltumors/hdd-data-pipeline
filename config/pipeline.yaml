name: "Harmonized Drug Dataset Version 2"
description: "Harmonized collection of drug measurements across assay types (HDD_v2)."

dataset:
  id: "HDD_v2"
  version: "2.0.0"

# Curated sub-dataset MAE inputs used to populate membership flags and source IDs
sub_dataset:
  jump:
    # JUMP Cell Painting cpg0016 MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19949901/files/cpg0016_emb_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2/cpg0016_emb_MultiAssayExperiment.rds"
    flag_column: "In.JUMP.CP"
    source_key_column: "JUMP.CP.ID"
    source_smiles_columns:
      - "JUMP.CP.SMILES"
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "AnnotationDB.Name"
      - "Control.Name"

  oasis:
    # OASIS cpg0037 MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19931212/files/cpg0037_emb_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2/cpg0037_emb_MultiAssayExperiment.rds"
    flag_column: "In.OASIS"
    source_key_column: "OASIS.ID"
    source_smiles_columns:
      - "OASIS.SMILES"
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "OASIS.Compound.Name"
      - "AnnotationDB.Name"

  geom:
    # GEOM descriptor MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19931210/files/geom_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2/geom_MultiAssayExperiment.rds"
    flag_column: "In.GEOM"
    source_key_column: "GEOM.Source.SMILES"
    source_smiles_columns:
      - "GEOM.Canonical.SMILES"
      - "GEOM.RDKit.SMILES"
      - "GEOM.Source.SMILES"
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "AnnotationDB.Name"

  lincs:
    # LINCS signature MAE RDS
    # GCS mirror should match Zenodo https://zenodo.org/records/19931152/files/lincs_MultiAssayExperiment.rds?download=1
    url: "https://storage.googleapis.com/annotationdb_pipeline_outputs/HDD_v2/lincs_MultiAssayExperiment.rds"
    flag_column: "In.LINCS"
    source_key_column: "LINCS.CMap.Name"
    source_smiles_columns:
      - "AnnotationDB.SMILES"
    source_name_columns:
      - "LINCS.CMap.Name"
      - "AnnotationDB.Name"

deep_chem:
  subdir: "DEEP_CHEM"
  pubchem_smiles_to_cid_url: "https://pubchem.ncbi.nlm.nih.gov/rest/download/.fetch/89/1394042153180808779.txt.gz"
  urls:
    blood_brain_barrier: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/BBBP.csv"
    toxcast: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/toxcast_data.csv.gz"
    tox21: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/tox21.csv.gz"
    sider: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/sider.csv.gz"
    clintox: "https://deepchemdata.s3-us-west-1.amazonaws.com/datasets/clintox.csv.gz"

colData:
  db_url: 'https://v2annotationdb.bhklab.ca/compound/all'
  # Compound detail fetch controls for AnnotationDB /compound/many
  fetch:
    details_url: 'https://v2annotationdb.bhklab.ca/compound/many'
    batch_size: 50
    workers: 6
    query_delay_seconds: 0.1
    golden_bioassay: true
  # Morgan fingerprint radii and vector sizes generated for every parseable SMILES
  fingerprints:
    radius_list: [2,3]
    dim_list: [1024,2048]
