[workspace]
name = "hdd-data-pipeline"
authors = [
    "James Bannon <bhklab.jamesbannon@gmail.com>",
    "Michael Tran <michaelcao-anh.tran@uhn.ca>",
    "Matthew Bocalon",
    "Sisira Kadambat Nair"
]
description = "Pipeline to create the Harmonized Drug Dataset Version 3 (HDD_v3)"
version = "3.0.0"
license = "MIT"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[environments]
quality = { features = ["quality"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[dependencies]
r-base = ">=4.5.3,<4.6"
bioconductor-multiassayexperiment = ">=1.36.1,<2"
r-tidyverse = ">=2.0.0,<3"
r-rmarkdown = ">=2.31,<3"
tqdm = ">=4.67.3,<5"
python = ">=3.13.13,<3.14"
rdkit = ">=2026.3.2,<2027"
bioconductor-summarizedexperiment = ">=1.40.0,<2"
snakemake = ">=9.19.0,<10"
pandas = ">=2.3.3,<3"
requests = ">=2.33.1,<3"
"r-data.table" = "*"
"r-matrix" = "*"
"r-yaml" = "*"

[tasks]
pipeline = {cmd = "snakemake -c 1", description="Regenerate the HDD v3 release."}
qc = {cmd = "Rscript -e \"rmarkdown::render('qc/hdd_quality_control.Rmd', output_format='html_document')\"", description="Render the tracked Harmonized Drug Dataset quality control report."}
reset = {cmd = "bash workflow/scripts/clean_pipeline_artifacts.sh", description="Delete generated pipeline artifacts under data/rawdata, data/procdata, and data/results after confirmation."}
zipup = {cmd = "tar -C data/results -cf - HDD_v3_tables | gzip -9 > data/results/HDD_v3_tables.tar.gz", description="Archive HDD v3 TSV and Matrix Market exports with max gzip compression."}

############################################## QUALITY ###############################################
# Quality includes linting, type checking, and formatting
[feature.quality.dependencies]
ruff = "*"

############################################## DOCS ################################################

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-include-markdown-plugin = ">=7.0.0,<8"

[feature.docs.tasks.doc-build]
cmd = "mkdocs build -f mkdocs.yaml"
description = "Build documentation with mkdocs"

[feature.docs.tasks.doc-serve]
cmd = "mkdocs serve -f mkdocs.yaml"
depends-on = ["doc-build"]
description = "Serve documentation with mkdocs, runs doc-build first"
