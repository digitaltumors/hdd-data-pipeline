[workspace]
name = "hdd-data-pipeline"
authors = [
    "James Bannon <bhklab.jamesbannon@gmail.com>",
    "Michael Tran <michaelcao-anh.tran@uhn.ca>",
    "Matthew Bocalon",
    "Sisira Kadambat Nair"
]
description = "Pipeline to create the Harmonized Drug Dataset Version 2 (HDD_v2)"
license = "MIT"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64", "linux-64"]

[environments]
quality = { features = ["quality"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[activation]
# convenient variables which can be used in scripts
env.CONFIG = "${PIXI_PROJECT_ROOT}/config"
env.METADATA = "${PIXI_PROJECT_ROOT}/metadata"
env.LOGS = "${PIXI_PROJECT_ROOT}/logs"
env.RAWDATA = "${PIXI_PROJECT_ROOT}/data/rawdata"
env.PROCDATA = "${PIXI_PROJECT_ROOT}/data/procdata"
env.RESULTS = "${PIXI_PROJECT_ROOT}/data/results"
env.SCRIPTS = "${PIXI_PROJECT_ROOT}/workflow/scripts"

[dependencies]
r-base = ">=4.5.3,<4.6"
bioconductor-multiassayexperiment = ">=1.36.1,<2"
r-tidyverse = ">=2.0.0,<3"
r-rmarkdown = ">=2.31,<3"
tqdm = ">=4.67.3,<5"
python = ">=3.13.13,<3.14"
rdkit = ">=2026.3.2,<2027"
bioconductor-summarizedexperiment = ">=1.40.0,<2"
snakemake = ">=9.19.0,<10"
pandas = ">=2.3.3,<3"
requests = ">=2.33.1,<3"

[tasks]
knit-qc = {cmd = "Rscript -e \"rmarkdown::render('qc/hdd_quality_control.Rmd', output_format='html_document')\"", description="Knit the quality control document to HTML file."}
reset = {cmd = "bash workflow/scripts/clean_pipeline_artifacts.sh", description="Delete generated pipeline artifacts under data/rawdata, data/procdata, and data/results after confirmation."}
zip-output = {cmd = ["python", "workflow/scripts/archive_mae_csvs.py", "data/results/HDD_v2_csv", "data/procdata/experiments/fingerprints", "data/results/HDD_v2_csv.tar.gz"], description="Archive MAE CSV exports and fingerprint MTX assays into data/results/HDD_v2_csv.tar.gz with max gzip compression."}

############################################## QUALITY ###############################################
# Quality includes linting, type checking, and formatting
[feature.quality.dependencies]
ruff = "*"

[feature.quality.tasks]
ruff-check.cmd = ["ruff", "check"]
ruff-check.inputs = ["config/ruff.toml", "workflow"]
ruff-check.description = "Run ruff check"

ruff-format.cmd = ["ruff", "format"]
ruff-format.inputs = ["config/ruff.toml", "workflow"]
ruff-format.depends-on = ["ruff-check"]
ruff-format.description = "Run ruff format, run check first"

qc.depends-on = ["ruff-format", "ruff-check"]
qc.description = "Quality check: ruff check and format"

############################################## DOCS ################################################

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-include-markdown-plugin = ">=7.0.0,<8"

[feature.docs.tasks.doc-build]
cmd = "mkdocs build -f mkdocs.yaml"
description = "Build documentation with mkdocs"

[feature.docs.tasks.doc-serve]
cmd = "mkdocs serve -f mkdocs.yaml"
depends-on = ["doc-build"]
description = "Serve documentation with mkdocs, runs doc-build first"

[pypi-dependencies]
damply = ">=0.26.1, <0.27"
